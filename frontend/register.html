<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - SkyGuard AI</title>
  <meta name="description" content="Create a free SkyGuard AI account to analyze resumes and build career roadmaps.">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="nav-brand">
        <div class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
          </svg>
        </div>
        <div class="brand-text">SkyGuard <span>AI</span></div>
      </a>

      <div class="nav-auth">
        <a href="login.html" class="btn btn-ghost btn-sm">Log In</a>
      </div>
    </div>
  </nav>

  <div class="container" style="padding: 3.5rem 1.5rem 6rem; max-width: 480px;">
    <div class="card card-elevated" style="padding: 2.5rem 2rem;">
      <div style="text-align: center; margin-bottom: 2rem;">
        <span class="badge badge-cyan" style="margin-bottom: 0.5rem;">Instant Access</span>
        <h1 style="font-size: 1.75rem; font-weight: 800; color: #ffffff;">Create Account</h1>
        <p style="color: var(--text-secondary); font-size: 0.875rem;">Get instant AI resume feedback and skill roadmaps.</p>
      </div>

      <div id="register-alert-area"></div>

      <form id="register-form">
        <div class="form-group">
          <label for="name" class="form-label">Full Name</label>
          <input type="text" id="name" name="name" class="form-control" placeholder="Alex Morgan" required autocomplete="name">
        </div>

        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="name@company.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Minimum 8 characters" required minlength="8" autocomplete="new-password">
        </div>

        <div class="form-group">
          <label for="confirm_password" class="form-label">Confirm Password</label>
          <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="••••••••" required minlength="8" autocomplete="new-password">
        </div>

        <button type="submit" id="register-btn" class="btn btn-cyan btn-lg" style="width: 100%; margin-top: 0.5rem;">
          <span>Create Free Account</span>
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.75rem; font-size: 0.85rem; color: var(--text-muted);">
        Already have an account? <a href="login.html" style="color: var(--accent-cyan); font-weight: 600;">Log in</a>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script>
    window.ENV_API_BASE_URL = "https://skyguard-ai-resume-analyzer.onrender.com";
  </script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('register-form');
      const btn = document.getElementById('register-btn');
      const alertArea = document.getElementById('register-alert-area');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirm_password = document.getElementById('confirm_password').value;

        if (password !== confirm_password) {
          alertArea.innerHTML = `
            <div class="alert alert-danger" style="margin-bottom: 1.25rem;">
              <span>Passwords do not match. Please re-enter.</span>
            </div>
          `;
          return;
        }

        btn.disabled = true;
        btn.textContent = 'Creating account...';
        alertArea.innerHTML = '';

        try {
          const res = await window.SkyGuardAPI.auth.register(name, email, password, confirm_password);
          if (res && res.success) {
            window.location.href = 'dashboard.html';
          } else {
            const errorMsg = (window.SkyGuardAPI && window.SkyGuardAPI.extractErrorMessage)
              ? window.SkyGuardAPI.extractErrorMessage(res, 'Failed to create account.')
              : ((res && res.error) || 'Failed to create account.');
            throw new Error(errorMsg);
          }
        } catch (err) {
          const displayMsg = (window.SkyGuardAPI && window.SkyGuardAPI.extractErrorMessage)
            ? window.SkyGuardAPI.extractErrorMessage(err, 'An error occurred during registration. Please try again.')
            : (err.message || 'An error occurred during registration. Please try again.');

          alertArea.innerHTML = `
            <div class="alert alert-danger" style="margin-bottom: 1.25rem;">
              <span>${displayMsg}</span>
            </div>
          `;
          btn.disabled = false;
          btn.textContent = 'Create Free Account';
        }
      });
    });
  </script>
</body>
</html>
