<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - SkyGuard AI</title>
  <meta name="description" content="Set a new password for your SkyGuard AI account.">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="nav-brand">
        <div class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
          </svg>
        </div>
        <div class="brand-text">SkyGuard <span>AI</span></div>
      </a>

      <div class="nav-auth">
        <a href="login.html" class="btn btn-ghost btn-sm">Log In</a>
      </div>
    </div>
  </nav>

  <div class="container" style="padding: 4rem 1.5rem 6rem; max-width: 480px;">
    <div class="card card-elevated" style="padding: 2.5rem 2rem;">
      <div style="text-align: center; margin-bottom: 2rem;">
        <span class="badge badge-cyan" style="margin-bottom: 0.5rem;">Security Verification</span>
        <h1 style="font-size: 1.75rem; font-weight: 800; color: #ffffff;">Set New Password</h1>
        <p style="color: var(--text-secondary); font-size: 0.875rem;">Create a strong new password for your account.</p>
      </div>

      <div id="reset-alert-area"></div>

      <form id="reset-form">
        <div class="form-group">
          <label for="password" class="form-label">New Password</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Minimum 8 characters" required minlength="8" autocomplete="new-password">
        </div>

        <div class="form-group">
          <label for="confirm_password" class="form-label">Confirm New Password</label>
          <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="••••••••" required minlength="8" autocomplete="new-password">
        </div>

        <button type="submit" id="reset-btn" class="btn btn-cyan btn-lg" style="width: 100%; margin-top: 0.5rem;">
          <span>Update Password</span>
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.75rem; font-size: 0.85rem; color: var(--text-muted);">
        Back to <a href="login.html" style="color: var(--accent-cyan); font-weight: 600;">Sign in</a>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const usp = new URLSearchParams(window.location.search);
      let token = usp.get('token');
      if (!token) {
        // Check if path has token like /reset-password/TOKEN
        const parts = window.location.pathname.split('/');
        const lastPart = parts[parts.length - 1];
        if (lastPart && lastPart !== 'reset_password.html' && lastPart !== 'reset-password') {
          token = lastPart;
        }
      }

      const form = document.getElementById('reset-form');
      const btn = document.getElementById('reset-btn');
      const alertArea = document.getElementById('reset-alert-area');

      if (!token) {
        alertArea.innerHTML = `
          <div class="alert alert-danger" style="margin-bottom: 1.25rem;">
            <span>Missing or invalid password reset token. Please request a new link.</span>
          </div>
        `;
        form.style.display = 'none';
        return;
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const password = document.getElementById('password').value;
        const confirm_password = document.getElementById('confirm_password').value;

        if (password !== confirm_password) {
          alertArea.innerHTML = `
            <div class="alert alert-danger" style="margin-bottom: 1.25rem;">
              <span>Passwords do not match. Please re-enter.</span>
            </div>
          `;
          return;
        }

        btn.disabled = true;
        btn.textContent = 'Updating...';
        alertArea.innerHTML = '';

        try {
          const res = await window.SkyGuardAPI.auth.resetPassword(token, password, confirm_password);
          alertArea.innerHTML = `
            <div class="alert alert-success" style="margin-bottom: 1.25rem;">
              <span>${(res && res.message) || 'Password reset successfully! Redirecting to login...'}</span>
            </div>
          `;
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 1500);
        } catch (err) {
          alertArea.innerHTML = `
            <div class="alert alert-danger" style="margin-bottom: 1.25rem;">
              <span>${err.message || 'The reset link is invalid or expired. Please request a new one.'}</span>
            </div>
          `;
          btn.disabled = false;
          btn.textContent = 'Update Password';
        }
      });
    });
  </script>
</body>
</html>
