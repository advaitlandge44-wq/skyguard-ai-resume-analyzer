<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - SkyGuard AI</title>
  <meta name="description" content="Reset your SkyGuard AI account password.">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="nav-brand">
        <div class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
          </svg>
        </div>
        <div class="brand-text">SkyGuard <span>AI</span></div>
      </a>

      <div class="nav-auth">
        <a href="login.html" class="btn btn-ghost btn-sm">Log In</a>
      </div>
    </div>
  </nav>

  <div class="container" style="padding: 4rem 1.5rem 6rem; max-width: 480px;">
    <div class="card card-elevated" style="padding: 2.5rem 2rem;">
      <div style="text-align: center; margin-bottom: 2rem;">
        <span class="badge badge-warning" style="margin-bottom: 0.5rem;">Password Recovery</span>
        <h1 style="font-size: 1.75rem; font-weight: 800; color: #ffffff;">Forgot Password</h1>
        <p style="color: var(--text-secondary); font-size: 0.875rem;">Enter your email and we'll dispatch a secure reset link.</p>
      </div>

      <div id="forgot-alert-area"></div>

      <form id="forgot-form">
        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="name@company.com" required autocomplete="email">
        </div>

        <button type="submit" id="forgot-btn" class="btn btn-cyan btn-lg" style="width: 100%; margin-top: 0.5rem;">
          <span>Send Reset Link</span>
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.75rem; font-size: 0.85rem; color: var(--text-muted);">
        Remembered your password? <a href="login.html" style="color: var(--accent-cyan); font-weight: 600;">Back to login</a>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script>
    window.ENV_API_BASE_URL = "https://skyguard-ai-resume-analyzer.onrender.com";
  </script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('forgot-form');
      const btn = document.getElementById('forgot-btn');
      const alertArea = document.getElementById('forgot-alert-area');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();

        btn.disabled = true;
        btn.textContent = 'Sending link...';
        alertArea.innerHTML = '';

        try {
          const res = await window.SkyGuardAPI.auth.forgotPassword(email);
          alertArea.innerHTML = `
            <div class="alert alert-info" style="margin-bottom: 1.25rem;">
              <span>${(res && res.message) || 'If an account exists for this email, a reset link has been dispatched.'}</span>
            </div>
          `;
          if (res && res.is_demo_reset && res.demo_reset_url) {
            alertArea.innerHTML += `
              <div style="margin-top: 1rem; text-align: center;">
                <a href="${res.demo_reset_url}" class="btn btn-secondary btn-sm">Direct Demo Reset Link →</a>
              </div>
            `;
          }
          btn.disabled = false;
          btn.textContent = 'Send Reset Link';
        } catch (err) {
          const displayMsg = (window.SkyGuardAPI && window.SkyGuardAPI.extractErrorMessage)
            ? window.SkyGuardAPI.extractErrorMessage(err, 'An error occurred. Please try again.')
            : (err.message || 'An error occurred. Please try again.');

          alertArea.innerHTML = `
            <div class="alert alert-danger" style="margin-bottom: 1.25rem;">
              <span>${displayMsg}</span>
            </div>
          `;
          btn.disabled = false;
          btn.textContent = 'Send Reset Link';
        }
      });
    });
  </script>
</body>
</html>
