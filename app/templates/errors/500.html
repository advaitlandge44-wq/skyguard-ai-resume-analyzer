{% extends "base.html" %}
{% block title %}500 - Server Error | SkyGuard AI{% endblock %}
{% block content %}
<div class="container-narrow" style="text-align: center; padding: 4rem 1rem;">
  <div class="stat-value" style="color: var(--danger); font-size: 4rem; margin-bottom: 0.5rem;">500</div>
  <h1 style="font-size: 1.75rem; margin-bottom: 0.75rem;">AI Service or Server Error</h1>
  <p style="color: var(--text-secondary); max-width: 450px; margin: 0 auto 1.75rem;">
    AI analysis is temporarily unavailable or an unexpected error occurred. Please try again in a few moments.
  </p>
  <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary">Return to Dashboard</a>
</div>
{% endblock %}
