{% extends "base.html" %}
{% block title %}400 - Bad Request | SkyGuard AI{% endblock %}
{% block content %}
<div class="container-narrow" style="text-align: center; padding: 4rem 1rem;">
  <div class="stat-value" style="color: var(--warning); font-size: 4rem; margin-bottom: 0.5rem;">400</div>
  <h1 style="font-size: 1.75rem; margin-bottom: 0.75rem;">Invalid Request</h1>
  <p style="color: var(--text-secondary); max-width: 450px; margin: 0 auto 1.75rem;">
    The server could not understand your request. Please verify your input parameters and try again.
  </p>
  <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary">Return to Dashboard</a>
</div>
{% endblock %}
